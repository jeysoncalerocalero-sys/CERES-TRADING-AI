<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CERES TRADING AI - Tutor de Scalping</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e11; color: #eaecef; font-family: sans-serif; }
    canvas { background-color: #12161c; width: 100%; height: 260px; border-radius: 8px; }
  </style>
</head>
<body class="p-3">

  <!-- ENCABEZADO CERES TRADING AI -->
  <header class="flex justify-between items-center mb-3 bg-gray-900 p-3 rounded-lg border border-yellow-500/30">
    <div>
      <h1 class="text-base font-extrabold text-yellow-400 tracking-wider">⚡ CERES TRADING AI</h1>
      <p class="text-xs text-gray-400">Tutor con IA en Vivo & Voz</p>
    </div>
    <div class="text-right">
      <span class="text-xs text-gray-400">Demo Balance</span>
      <p id="balance" class="text-sm font-bold text-emerald-400">$1,000.00</p>
    </div>
  </header>

  <!-- SELECCIÓN DE MONEDAS VOLÁTILES -->
  <div class="flex gap-2 mb-2">
    <button onclick="cambiarMoneda('BTC/USDT', 65000)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded border border-yellow-500/40 text-yellow-400 font-bold">BTC/USDT</button>
    <button onclick="cambiarMoneda('SOL/USDT', 145)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded border border-purple-500/40 text-purple-400 font-bold">SOL/USDT</button>
    <button onclick="cambiarMoneda('ETH/USDT', 2600)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded border border-blue-500/40 text-blue-400 font-bold">ETH/USDT</button>
  </div>

  <!-- SELECCIÓN DE APALANCAMIENTO -->
  <div class="mb-3 bg-gray-900 p-2 rounded-lg border border-gray-800">
    <span class="text-xs text-gray-400 block mb-1">Apalancamiento de Scalping:</span>
    <div class="flex gap-1">
      <button onclick="setLeverage(10)" id="lev-10" class="flex-1 bg-gray-800 text-xs py-1 rounded text-gray-300 font-bold border border-gray-700">10x</button>
      <button onclick="setLeverage(20)" id="lev-20" class="flex-1 bg-gray-800 text-xs py-1 rounded text-gray-300 font-bold border border-gray-700">20x</button>
      <button onclick="setLeverage(50)" id="lev-50" class="flex-1 bg-gray-800 text-xs py-1 rounded text-gray-300 font-bold border border-gray-700">50x</button>
      <button onclick="setLeverage(75)" id="lev-75" class="flex-1 bg-yellow-600 text-xs py-1 rounded text-white font-bold border border-yellow-500">75x ⚡</button>
    </div>
  </div>

  <!-- GRÁFICO EN VIVO -->
  <div class="relative mb-3">
    <div class="absolute top-2 left-3 z-10 flex items-center gap-2">
      <span id="symbol-display" class="text-xs font-bold text-white bg-gray-900/90 px-2 py-1 rounded border border-gray-700">BTC/USDT</span>
      <span id="price-display" class="text-xs font-mono font-bold text-emerald-400">$65,000.00</span>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <!-- PANEL DE RAZONAMIENTO EN VIVO CERES AI -->
  <div class="bg-gray-900 border border-yellow-500/30 rounded-lg p-3 mb-3">
    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
        <h2 class="text-xs font-bold text-yellow-400">CERES AI: Análisis en Vivo</h2>
      </div>
      <button onclick="toggleVoz()" id="btn-voz" class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-gray-300 border border-gray-700">🔊 Voz: Activada</button>
    </div>
    <p id="ai-live-text" class="text-xs text-gray-300 leading-relaxed">Esperando formación de vela...</p>
  </div>

  <!-- OPERACIÓN Y BOTONES -->
  <div class="grid grid-cols-2 gap-2 mb-3">
    <button onclick="operar('LONG')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg text-sm shadow-lg active:scale-95 transition">
      🟢 COMPRAR (LONG)
    </button>
    <button onclick="operar('SHORT')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg text-sm shadow-lg active:scale-95 transition">
      🔴 VENDER (SHORT)
    </button>
  </div>

  <!-- RETROALIMENTACIÓN DE CORRECCIÓN -->
  <div id="feedback-box" class="hidden bg-gray-900 border p-3 rounded-lg mb-3">
    <h3 id="feedback-title" class="text-xs font-bold mb-1"></h3>
    <p id="feedback-desc" class="text-xs leading-relaxed"></p>
  </div>

  <script>
    let symbol = 'BTC/USDT';
    let currentPrice = 65000;
    let leverage = 75;
    let vozActiva = true;
    let candles = [];
    let ultimoTextoVoz = "";

    function setLeverage(lev) {
      leverage = lev;
      [10, 20, 50, 75].forEach(l => {
        let btn = document.getElementById('lev-' + l);
        if (l === lev) {
          btn.className = "flex-1 bg-yellow-600 text-xs py-1 rounded text-white font-bold border border-yellow-500";
        } else {
          btn.className = "flex-1 bg-gray-800 text-xs py-1 rounded text-gray-300 font-bold border border-gray-700";
        }
      });
      hablar("Apalancamiento ajustado a " + lev + " x. Precaución con la volatilidad.");
    }

    function toggleVoz() {
      vozActiva = !vozActiva;
      document.getElementById('btn-voz').innerText = vozActiva ? "🔊 Voz: Activada" : "🔇 Voz: Silenciada";
    }

    function hablar(texto) {
      if (!vozActiva || !('speechSynthesis' in window)) return;
      if (texto === ultimoTextoVoz) evitaRepeticion = true;
      ultimoTextoVoz = texto;
      window.speechSynthesis.cancel();
      let msg = new SpeechSynthesisUtterance(texto.replace(/[*#]/g, ''));
      msg.lang = 'es-ES';
      msg.rate = 1.1;
      window.speechSynthesis.speak(msg);
    }

    function initCandles() {
      candles = [];
      let base = currentPrice;
      for (let i = 0; i < 18; i++) {
        let open = base + (Math.random() - 0.5) * (currentPrice * 0.002);
        let close = open + (Math.random() - 0.5) * (currentPrice * 0.002);
        let high = Math.max(open, close) + Math.random() * (currentPrice * 0.001);
        let low = Math.min(open, close) - Math.random() * (currentPrice * 0.001);
        candles.push({ open, high, low, close });
        base = close;
      }
    }

    function cambiarMoneda(s, p) {
      symbol = s;
      currentPrice = p;
      document.getElementById('symbol-display').innerText = symbol;
      initCandles();
      hablar("Cambiado a " + s);
    }

    function renderChart() {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let maxP = Math.max(...candles.map(c => c.high));
      let minP = Math.min(...candles.map(c => c.low));
      let range = (maxP - minP) || 1;
      let candleWidth = (canvas.width - 30) / candles.length;

      candles.forEach((c, i) => {
        let x = i * candleWidth + 10;
        let isGreen = c.close >= c.open;
        let yHigh = canvas.height - ((c.high - minP) / range) * (canvas.height - 30) - 15;
        let yLow = canvas.height - ((c.low - minP) / range) * (canvas.height - 30) - 15;
        let yOpen = canvas.height - ((c.open - minP) / range) * (canvas.height - 30) - 15;
        let yClose = canvas.height - ((c.close - minP) / range) * (canvas.height - 30) - 15;

        ctx.strokeStyle = isGreen ? '#10b981' : '#f43f5e';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + candleWidth / 2, yHigh);
        ctx.lineTo(x + candleWidth / 2, yLow);
        ctx.stroke();

        ctx.fillStyle = isGreen ? '#10b981' : '#f43f5e';
        let h = Math.max(Math.abs(yClose - yOpen), 2);
        ctx.fillRect(x + 2, Math.min(yOpen, yClose), candleWidth - 4, h);
      });
    }

    setInterval(() => {
      let change = (Math.random() - 0.49) * (currentPrice * 0.0015);
      currentPrice += change;
      let lastCandle = candles[candles.length - 1];
      lastCandle.close = currentPrice;
      if (currentPrice > lastCandle.high) lastCandle.high = currentPrice;
      if (currentPrice < lastCandle.low) lastCandle.low = currentPrice;

      document.getElementById('price-display').innerText = '$' + currentPrice.toFixed(2);
      renderChart();
      analizarVelaEnVivo(lastCandle);
    }, 1200);

    function analizarVelaEnVivo(c) {
      let range = c.high - c.low;
      let upperWick = c.high - Math.max(c.open, c.close);
      let lowerWick = Math.min(c.open, c.close) - c.low;
      let text = "";

      if (upperWick > range * 0.38) {
        text = "⚠️ Rechazo Superior en " + symbol + ". Vendedores absorbiendo compras.";
      } else if (lowerWick > range * 0.38) {
        text = "📈 Absorción compradora detectada en la zona baja.";
      } else if (c.close > c.open) {
        text = "🟢 Impulso alcista activo en la vela actual.";
      } else {
        text = "🔴 Presión bajista dominando el movimiento.";
      }

      document.getElementById('ai-live-text').innerText = text;
    }

    function operar(tipo) {
      let c = candles[candles.length - 1];
      let range = c.high - c.low;
      let upperWick = c.high - Math.max(c.open, c.close);
      let lowerWick = Math.min(c.open, c.close) - c.low;
      let box = document.getElementById('feedback-box');
      let title = document.getElementById('feedback-title');
      let desc = document.getElementById('feedback-desc');

      box.classList.remove('hidden', 'border-red-500', 'border-emerald-500', 'bg-red-950/40', 'bg-emerald-950/40');

      if (tipo === 'LONG' && upperWick > range * 0.35) {
        box.classList.add('border-red-500', 'bg-red-950/40');
        title.className = "text-xs font-bold text-red-400 mb-1";
        title.innerText = "❌ ERROR CON APALANCAMIENTO " + leverage + "X";
        desc.innerText = "¡Peligro! Entraste en LONG justo en una mecha de rechazo superior con apalancamiento alto. Te habrían liquidado por comprar en la cima.";
        hablar("Error crítico. Compraste en la mecha alta con apalancamiento alto.");
      } else if (tipo === 'SHORT' && lowerWick > range * 0.35) {
        box.classList.add('border-red-500', 'bg-red-950/40');
        title.className = "text-xs font-bold text-red-400 mb-1";
        title.innerText = "❌ ERROR CON APALANCAMIENTO " + leverage + "X";
        desc.innerText = "¡Peligro! Vendiste en SHORT en la mecha inferior donde los compradores defienden la posición.";
        hablar("Error de entrada en contra de la absorción baja.");
      } else {
        box.classList.add('border-emerald-500', 'bg-emerald-950/40');
        title.className = "text-xs font-bold text-emerald-400 mb-1";
        title.innerText = "✅ ENTRADA VÁLIDA (" + leverage + "X)";
        desc.innerText = "Buena ejecución a favor del flujo de la vela. Gestión de riesgo adecuada para scalping rápido.";
        hablar("Operación correcta validada por Ceres.");
      }
    }

    initCandles();
  </script>
</body>
</html>
